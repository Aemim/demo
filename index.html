const Stars = ({ rating, size = 'sm' }) => {
  const filled = Math.floor(rating);
  const partial = rating - filled > 0.5 ? 1 : 0;
  return (
    <span className="stars" style={{ fontSize: size === 'lg' ? '1rem' : '0.8rem' }}>
      {'★'.repeat(filled)}{'☆'.repeat(5 - filled - partial)}{partial ? '½' : ''}
    </span>
  );
};
